name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd skills && zip -r ../skaf.zip skaf -x 'skaf/evals/*'
      - run: gh release upload "$TAG" skaf.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
